# Dry run config — compact datasets only, no FineWeb
lora_r: 8
lora_dropout: 0.0
target_modules:
  - down_proj

use_kl_loss: true

ctx_encoder_type: per_layer_activations
n_latent_queries: 8
num_blocks: 9
num_self_attn_per_block: 0

gradient_accumulation_steps: 1
max_packed_inp_len: 4096
max_packed_ctx_len: 4096

# data — compact datasets only (skip FineWeb to save time)
train_ds_names:
  - self_gen/mistralai/Ministral-3-3B-Instruct-2512_temp_0.0_closed_qa_prob_1.0/squad_compact
  - self_gen/mistralai/Ministral-3-3B-Instruct-2512_temp_0.0_closed_qa_prob_1.0/drop_compact

val_ds_names:
  - squad
  - drop
